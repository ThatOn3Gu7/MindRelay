name: Build MindRelay APK

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # The ubuntu-24.04 runner ships ANDROID_HOME with platform android-37.0
      # and build-tools 37.0.0 preinstalled, so no SDK download step is needed.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-log.txt
          echo "--- APK outputs ---"
          find app/build -name '*.apk' -print 2>/dev/null | tee apk-paths.txt
          echo "--- debug outputs tree ---"
          find app/build/outputs/apk -maxdepth 2 -type d -print 2>/dev/null | tee -a apk-paths.txt

      - name: Publish build log to job summary
        if: always()
        run: |
          {
            echo '## Build log (tail)'
            echo '```text'
            tail -n 300 build-log.txt
            echo '```'
            echo '## APK paths found'
            echo '```text'
            cat apk-paths.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          if-no-files-found: ignore

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mindrelay-debug-apk
          path: app/build/outputs/**/*.apk
          if-no-files-found: warn
